#
# Sample sysmon settings.  sysmon reads them from ~/.config/sysmon/sysmon.ini
# (per user); File -> Settings in sysmon edits that file for you.  Anything
# not set falls back to built-in defaults worked out from the hardware.
#
#
# For drives, you can ignore a device from collecting the temperature,
# or the performance data.  A good device to ignore for temperature
# collection is the mmcblk0 device, as no temp available.  Also
# in a system using RAID, the temperature is not available.
# Use exact device names as listed in /sys/block (mmcblk0, not mmcblk).
#
[drive]
    temp_ignore = mmcblk0
    perf_ignore = mmcblk0

#
# When monitoring the network, you can ignore specific devices.  The
# loopback interface (lo) is a good one to ignore, as is any unused
# port, such as eth0 on a Pi that only uses Wi-Fi (or on the Argon ONE UP,
# where eth0 exists but is not connected to anything).
# Use exact interface names as listed in /sys/class/net.
#
[network]
    device_ignore = "lo,eth0"

#
# if your system has a separate case fan, you can monitor the speed if
# it has a tachometer attached to a GPIO pin (BCM numbering, 0-27).
# Only shown on a Raspberry Pi 5 / CM5.
#
#[cooling]
#    casefan = 18

#
# Some drives need a smartctl device type, for example a drive behind a
# USB-SATA bridge.  smartctl runs as root, so only "-d TYPE" is accepted.
#
#[smartctl]
#    sda = -d sat
