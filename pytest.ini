[pytest]
testpaths = tests
addopts = -ra
# The app uses PyQt6; pin it so pytest-qt never picks up another installed Qt binding.
qt_api = pyqt6
# Noise from the SWIG-built lgpio bindings behind RPi.GPIO on the Pi 5.
filterwarnings =
    ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
