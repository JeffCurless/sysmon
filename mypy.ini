# mypy configuration for sysmon.  Run from the repo root:  mypy src/*.py tests/*.py icons/*.py
[mypy]
# Also type-check the bodies of functions that have no annotations.
check_untyped_defs = True
# Make the tests' imports (modules in src/, conftest) resolvable.
mypy_path = $MYPY_CONFIG_FILE_DIR/src, $MYPY_CONFIG_FILE_DIR/tests

# Libraries that ship without type information.  hypothesis and pytest-qt
# are typed, but are often installed where the system mypy cannot see them.
[mypy-gpiozero.*,RPi.*,hypothesis.*,pytestqt.*]
ignore_missing_imports = True
